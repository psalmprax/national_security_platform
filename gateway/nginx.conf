events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # Backend: Core API
    upstream backend_node {
        server core-api:8080;
    }

    # Frontend: Web Dashboard
    upstream frontend_node {
        server web-dashboard:80;
    }

    # Mobile: Mobile Client
    upstream mobile_node {
        server mobile-client:80;
    }

    server {
        listen 80 default_server;
        server_name _;

        # 1. API Routing
        location /api/ {
            proxy_pass http://backend_node/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Mobile Client Routing
        location /mobile/ {
            proxy_pass http://mobile_node/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Web Dashboard (Default)
        location / {
            proxy_pass http://frontend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Next.js hydration support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }
}
