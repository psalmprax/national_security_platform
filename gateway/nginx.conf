events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 http://localhost:8002 http://127.0.0.1:8002 http://intelligence-service:8000 https://*.mapbox.com https://events.mapbox.com http://130.61.26.105:8086 https://130.61.26.105:8443; img-src 'self' http: https: data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' blob:;" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=10s;

    # Backend: Core API
    upstream backend_node {
        server core-api:8080;
    }

    # Frontend: Web Dashboard
    upstream frontend_node {
        server web-dashboard:80;
    }

    # Mobile: Mobile Client
    upstream mobile_node {
        server mobile-client:80;
    }

    server {
        listen 80 default_server;
        server_name _;

        # 1. API Routing
        location /api/v1/events/stream {
            proxy_pass http://backend_node/api/v1/events/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_timeout 24h;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_node/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health Check Proxying
        location /health/core {
            proxy_pass http://backend_node/health;
            proxy_set_header Host $host;
        }

        location /health/intelligence {
            proxy_pass http://intelligence-service:8000/health;
            proxy_set_header Host $host;
        }

        location /health/sentinel {
            proxy_pass http://security-sentinel:8001/health;
            proxy_set_header Host $host;
        }

        # Metrics
        location /metrics/core {
            proxy_pass http://backend_node/metrics;
            proxy_set_header Host $host;
        }

        location /metrics/sentinel {
            proxy_pass http://security-sentinel:8001/metrics;
            proxy_set_header Host $host;
        }

        # 2. Mobile Client Routing
        location /mobile/ {
            proxy_pass http://mobile_node/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Web Dashboard (Default)
        location / {
            proxy_pass http://frontend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Next.js hydration support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Relay all requests to the same logic (DRY: or we could use include)
        # For simplicity in this demo, we can just mirror or redirect 80 to 443
        # However, to support port 8085 as HTTP, we keep the blocks separate.

        location / {
            proxy_pass http://frontend_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Next.js hydration support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        # Health / Metrics for SSL
        location /health/core { proxy_pass http://backend_node/health; proxy_set_header Host $host; }
        location /api/ { 
            proxy_pass http://backend_node/api/;
            proxy_set_header Host $host;
        }
    }
}
