services:
  # Core Platform API (Golang)
  core-api:
    build:
      context: ./backend/core-api
      dockerfile: Dockerfile
    # Ports removed: Now accessible via gateway/api
    environment:
      - PORT=8080
      - GRPC_PORT=50051
      - DATABASE_URL=postgresql://root@cockroachdb:26257/defaultdb?sslmode=verify-ca&sslrootcert=/etc/ssl/certs/ca.crt&sslcert=/etc/ssl/certs/client.root.crt&sslkey=/etc/ssl/certs/client.root.key
      - NATS_URL=nats://${NATS_TOKEN:-nats_token_change_immediately}@nats:4222
      - INTELLIGENCE_SERVICE_URL=intelligence-service:50051
      - JWT_SECRET=${JWT_SECRET}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - TLS_CERT_FILE=/etc/nginx/certs/server.crt
      - TLS_KEY_FILE=/etc/nginx/certs/server.key
      - ALLOWED_ORIGINS=http://localhost:8085,http://localhost:3000
      # Vault Integration (AppRole)
      - VAULT_ADDR=http://vault:8200
      - VAULT_ROLE_ID=16296aec-baed-fee5-e859-21daf3afc67e
      - VAULT_SECRET_ID=1a497874-91b0-79d2-89bc-add1621ebc74
      - VAULT_SECRET_ID=1a497874-91b0-79d2-89bc-add1621ebc74
      # Removed Root Token for better security demo
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=core-api
    volumes:
      - ./gateway/certs:/etc/nginx/certs:ro
      - ./cockroach-certs/ca.crt:/etc/ssl/certs/ca.crt:ro
      - ./cockroach-certs/client.root.crt:/etc/ssl/certs/client.root.crt:ro
      - ./cockroach-certs/client.root.key:/etc/ssl/certs/client.root.key:ro
    depends_on:
      intelligence-service:
        condition: service_started
      cockroachdb:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - national-security-net

  # Intelligence Analysis Service (Python)
  intelligence-service:
    build:
      context: ./backend/intelligence-service
      dockerfile: Dockerfile
    ports:
      - "8002:8000"
    environment:
      - ENV=development
      - NATS_URL=nats://${NATS_TOKEN:-nats_token_change_immediately}@nats:4222
      - DATABASE_URL=postgresql://root@cockroachdb:26257/defaultdb?sslmode=verify-ca&sslrootcert=/etc/ssl/certs/ca.crt&sslcert=/etc/ssl/certs/client.root.crt&sslkey=/etc/ssl/certs/client.root.key
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=intelligence-service
    depends_on:
      cockroachdb:
        condition: service_healthy
      nats:
        condition: service_started
    volumes:
      - ./backend/intelligence-service:/app
      - ./cockroach-certs/ca.crt:/etc/ssl/certs/ca.crt:ro
      - ./cockroach-certs/client.root.crt:/etc/ssl/certs/client.root.crt:ro
      - ./cockroach-certs/client.root.key:/etc/ssl/certs/client.root.key:ro
    networks:
      - national-security-net

  # CockroachDB (Distributed SQL Engine)
  cockroachdb:
    image: cockroachdb/cockroach:latest-v23.1
    command: start-single-node --certs-dir=/cockroach/cockroach-data/certs --accept-sql-without-tls
    # Ports removed: Database only accessible through internal network
    # ports:
    #   - "26257:26257"
    #   - "8081:8080"
    volumes:
      - cockroach_data:/cockroach/cockroach-data
      - ./cockroach-certs:/cockroach/cockroach-data/certs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - national-security-net

  # Redis (Caching & Message Broker)
  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - national-security-net

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change_this_password_123}
    volumes:
      - minio_data:/data
    networks:
      - national-security-net

  # NATS JetStream (Message Bus)
  nats:
    image: nats:alpine
    command: "--js --sd=/data --auth ${NATS_TOKEN:-nats_token_change_immediately}"
    ports:
      - "4222:4222" # Client
      - "8222:8222" # Monitoring
    volumes:
      - nats_data:/data
    networks:
      - national-security-net

  # Mobile Client (Flutter Web)
  mobile-client:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    # Ports removed: Now accessible via gateway/mobile
    depends_on:
      - core-api
    networks:
      - national-security-net

  # Web Dashboard (Next.js)
  web-dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.eyJ1IjoicHNhbG1wcmF4IiwiYSI6ImNta3lsdnNtajA4M2ozZXM2Mnd0cWF0OHMifQ.mI66qXgyqyh6kRVSoJYLhQ}
        - NEXT_PUBLIC_API_URL=
    # Ports removed: Now accessible via gateway
    environment:
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN:-pk.eyJ1IjoicHNhbG1wcmF4IiwiYSI6ImNta3lsdnNtajA4M2ozZXM2Mnd0cWF0OHMifQ.mI66qXgyqyh6kRVSoJYLhQ}
      - NEXT_PUBLIC_API_URL=
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - core-api
    networks:
      - national-security-net

  # Security Gateway (Unified Entry Point)
  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
    ports:
      - "8086:80"
      - "8443:443"
    depends_on:
      - core-api
      - web-dashboard
      - mobile-client
    networks:
      - national-security-net

  # Security Sentinel (Continuous Compliance Scanner)
  security-sentinel:
    build:
      context: ./backend/security-sentinel
      dockerfile: Dockerfile
    environment:
      - CORE_API_URL=https://core-api:8080
      - DATABASE_URL=postgresql://root@cockroachdb:26257/defaultdb?sslmode=verify-ca&sslrootcert=/etc/ssl/certs/ca.crt&sslcert=/etc/ssl/certs/client.root.crt&sslkey=/etc/ssl/certs/client.root.key
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=security-sentinel
    depends_on:
      - core-api
    networks:
      - national-security-net
    ports:
      - "8001:8001"
    volumes:
      - ./backend/core-api:/usr/src/scan/core-api:ro
      - ./backend/intelligence-service:/usr/src/scan/intelligence-service:ro
      - ./backend/security-sentinel:/usr/src/scan/self:ro
      - ./cockroach-certs/ca.crt:/etc/ssl/certs/ca.crt:ro
      - ./cockroach-certs/client.root.crt:/etc/ssl/certs/client.root.crt:ro
      - ./cockroach-certs/client.root.key:/etc/ssl/certs/client.root.key:ro
      - ./gateway/certs/server.crt:/usr/local/share/ca-certificates/gateway.crt:ro

  # Vault (Secrets Management)
  vault:
    image: hashicorp/vault:1.13.3
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - national-security-net

  # Backup Runner (Automated Disaster Recovery)
  backup-runner:
    image: ubuntu:latest
    volumes:
      - ./scripts:/scripts # Removed :ro to allow chmod if necessary, though host chmod is better
      - ./scripts/backups:/scripts/backups
      - /var/run/docker.sock:/var/run/docker.sock
    command: /scripts/backup_runner.sh
    restart: always
    networks:
      - national-security-net
    entrypoint: [ "/bin/bash", "-c", "apt-get update && apt-get install -y cron docker.io && chmod +x /scripts/*.sh && /scripts/backup_runner.sh" ]

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    networks:
      - national-security-net

  # Grafana (Visualization Dashboard)
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "5000:3000"
    depends_on:
      - prometheus
    networks:
      - national-security-net

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - national-security-net

# Note: In production, these volumes should be backed by encrypted storage (e.g., AWS EBS with KMS)
volumes:
  cockroach_data:
  redis_data:
  minio_data:
  nats_data:
  prometheus_data:
  grafana_data:


networks:
  national-security-net:
    driver: bridge
