apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-service
  namespace: national-security
  labels:
    app: intelligence-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: intelligence-service
  template:
    metadata:
      labels:
        app: intelligence-service
    spec:
      containers:
      - name: intelligence-service
        image: national-security-platform-intelligence-service:latest
        ports:
        - containerPort: 8000
        - containerPort: 50051
        env:
        - name: ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: core-api-secrets
              key: DATABASE_URL
        - name: NATS_URL
          value: "nats://nats:4222"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
