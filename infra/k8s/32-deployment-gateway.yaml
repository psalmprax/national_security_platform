apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: national-security
  labels:
    app: gateway
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        tier: edge
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: tls-certs
          mountPath: /etc/nginx/certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health/core
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
      volumes:
      - name: nginx-config
        configMap:
          name: gateway-config
      - name: tls-certs
        secret:
          secretName: gateway-tls
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: national-security
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
  - name: http
    port: 80
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
