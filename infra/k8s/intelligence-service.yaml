apiVersion: apps/v1
kind: Deployment
metadata:
  name: intelligence-service
  namespace: national-security
  labels:
    app: intelligence-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intelligence-service
  template:
    metadata:
      labels:
        app: intelligence-service
    spec:
      containers:
      - name: intelligence-service
        image: national-security/intelligence-service:latest
        imagePullPolicy: Never # For local dev
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "1Gi" # AI requires more RAM
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: intelligence-service
  namespace: national-security
spec:
  selector:
    app: intelligence-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
