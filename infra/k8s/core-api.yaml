apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api
  namespace: national-security
  labels:
    app: core-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-api
  template:
    metadata:
      labels:
        app: core-api
    spec:
      containers:
      - name: core-api
        image: national-security/core-api:latest
        imagePullPolicy: Never # For local dev
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: national-security
spec:
  selector:
    app: core-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
