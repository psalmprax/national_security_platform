apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: national-security
  labels:
    app: nats
    tier: messaging
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
        tier: messaging
    spec:
      containers:
      - name: nats
        image: nats:alpine
        command: ["nats-server", "--js", "--sd=/data", "--auth", "$(NATS_TOKEN)"]
        env:
        - name: NATS_TOKEN
          valueFrom:
            secretKeyRef:
              name: core-api-secrets
              key: NATS_TOKEN
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 8222
          name: monitoring
        volumeMounts:
        - name: nats-data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  volumeClaimTemplates:
  - metadata:
      name: nats-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: national-security
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitoring
    port: 8222
    targetPort: 8222
