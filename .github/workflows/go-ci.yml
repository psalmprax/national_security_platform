name: Go Core API CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/core-api/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/core-api/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/core-api/go.sum

      - name: Install dependencies
        run: go mod download
        working-directory: backend/core-api

      - name: Run Tests
        run: go test -v ./...
        working-directory: backend/core-api
        env:
          MASTER_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
          JWT_SECRET: ci_test_secret
