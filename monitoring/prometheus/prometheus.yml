global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'core-api'
    scheme: https
    metrics_path: '/metrics'
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ['core-api:8080']

  - job_name: 'intelligence-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['intelligence-service:8000']

  - job_name: 'security-sentinel'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['security-sentinel:8001']
